version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # @astrojs/check only supports TypeScript ^5 || ^6. Remove once it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
  # Keeps the SHA-pinned actions in the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
